# quickproof config for openssl-punycode (quickproof/tools/clight.sh): the library units.  qp adds one unit per harness/*.c.
# Per-law linking: each law's program links only the units its harness needs (quickproof docs/LINKING.md).
#
# Code under test: crypto/punycode.c of OpenSSL 3.6.5 (ossl_punycode_decode, ossl_a2ulabel, adapt, is_basic,
# digit_decoded, codepoint2utf8), patched (patch/osslpatch.py: idiom edits I1, I2 and the fix D1), and the WPACKET functions of
# crypto/packet.c that ossl_a2ulabel reaches, verbatim in patch/units/packet_ext.c (patch/extract.py --check).
# Configuration: x86_64 LP64 (char is signed), a release build (-DNDEBUG: ossl_assert is a plain test), compiled
# against the header shim patch/include/ (patch/PATCH.md, "The header shim") and upstream's
# include/crypto/punycode.h.  patch/shim/ossl_shim.c is the rest of the program in plain C, verified with the code:
# CRYPTO_zalloc/CRYPTO_free (OpenSSL's default allocator, crypto/mem.c, plus an allocation-failure knob and a
# live-block counter), strlen, strchr, strncmp, and a trapping BUF_MEM_grow (unreachable: ossl_a2ulabel's WPACKET is
# static).  quickproof/libc/libc.c provides memcpy and memset (WPACKET_memcpy, CRYPTO_zalloc); the malloc unit owns
# malloc/free.
LINK=per-law
INC=(-Ipatch/include -Iinclude -isystem "$(gcc -print-file-name=include)")
DEFS=(-DNDEBUG)
UNITS=(
  "crypto/punycode.c=src/punycode"
  "patch/units/packet_ext.c=src/packet"
  "patch/shim/ossl_shim.c=src/shim"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"   # the unit that owns malloc/free (VST's mem_mgr)
)

# one unit per harness/*.c (added by tools/qp)
UNITS+=(
  "harness/api_a2ulabel_copy.c=src/harness/api_a2ulabel_copy"
  "harness/api_a2ulabel_labels.c=src/harness/api_a2ulabel_labels"
  "harness/api_a2ulabel_nul.c=src/harness/api_a2ulabel_nul"
  "harness/api_a2ulabel_size.c=src/harness/api_a2ulabel_size"
  "harness/api_decode_capacity.c=src/harness/api_decode_capacity"
  "harness/api_decode_deterministic.c=src/harness/api_decode_deterministic"
  "harness/rfc_a2ulabel_utf8.c=src/harness/rfc_a2ulabel_utf8"
  "harness/rfc_ace_any_case.c=src/harness/rfc_ace_any_case"
  "harness/rfc_basic_first.c=src/harness/rfc_basic_first"
  "harness/rfc_digit_case.c=src/harness/rfc_digit_case"
  "harness/rfc_samples.c=src/harness/rfc_samples"
  "harness/rfc_unique.c=src/harness/rfc_unique"
  "harness/rj_a2ulabel_any.c=src/harness/rj_a2ulabel_any"
  "harness/rj_decode_any.c=src/harness/rj_decode_any"
  "harness/rj_decode_invalid.c=src/harness/rj_decode_invalid"
  "harness/rt_roundtrip.c=src/harness/rt_roundtrip"
  "harness/x_a2ulabel.c=src/harness/x_a2ulabel"
  "harness/x_decode.c=src/harness/x_decode"
  "harness/x_roundtrip.c=src/harness/x_roundtrip"
)
